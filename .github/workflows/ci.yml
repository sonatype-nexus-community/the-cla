name: Continuous Integration

# This GitHub action runs your tests for each pull request and push.
# Optionally, you can turn it on using a schedule for regular testing.
on:
    pull_request:
        paths-ignore:
            - 'README.md'
    push:
        branches:
            - main

env:
    LC_APPLICATION_ID: the-cla

# Testing only needs permissions to read the repository contents.
permissions:
    contents: read

jobs:
    build:
        name: Build & Test
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - name: Checkout Code
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

            - name: Setup Node
              uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e #v6.4.0
              with:
                  node-version: '20.x'

            - name: Setup Go
              uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c #v6.4.0
              with:
                  go-version-file: 'go.mod'
                  cache: true

            - name: Install Frontend Dependencies
              run: npm ci

            - name: Build Frontend
              run: npm run build

            - name: Build Backend
              run: |
                  COMMIT=$(git rev-parse --short HEAD)
                  DATE=$(git log -1 --format=%cd --date=iso)
                  VERSION=$(git describe --abbrev=0 --tags 2>/dev/null | sed 's/^v//' || echo "dev")
                  go build \
                    -ldflags="-X 'github.com/sonatype-nexus-community/the-cla/buildversion.BuildVersion=${VERSION}' \
                              -X 'github.com/sonatype-nexus-community/the-cla/buildversion.BuildTime=${DATE}' \
                              -X 'github.com/sonatype-nexus-community/the-cla/buildversion.BuildCommit=${COMMIT}'" \
                    ./server.go

            - name: Test Backend
              run: go test ./...

            - name: Test Frontend
              run: npm test

    sonatype:
        name: Sonatype Lifecycle
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - name: Checkout Code
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

            - name: Setup Node
              uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e #v6.4.0
              with:
                  node-version: '20.x'

            - name: Setup Go
              uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c #v6.4.0
              with:
                  go-version-file: 'go.mod'
                  cache: true

            # See https://help.sonatype.com/en/npm-application-analysis.html
            - name: Install Production Node Dependencies
              run: npm ci --omit=dev

            - name: Login to Docker Hub
              uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 #v4.1.0
              with:
                  username: ${{ secrets.DOCKER_HUB_USERNAME }}
                  password: ${{ secrets.DOCKER_HUB_TOKEN }}

            - name: Build Container and export to Docker
              uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f #v7.1.0
              with:
                  context: .
                  file: ./Dockerfile
                  load: true
                  platforms: linux/amd64
                  tags: sonatypecommunity/the-cla:${{ github.sha }}

            - name: Sonatype Lifecycle Evaluation
              id: evaluate
              uses: sonatype/actions/evaluate@v1
              with:
                  iq-server-url: ${{ vars.SONATYPE_PLATFORM_URL }}
                  username: ${{ secrets.SONATYPE_LIFECYCLE_USERNAME }}
                  password: ${{ secrets.SONATYPE_LIFECYCLE_PASSWORD }}
                  application-id: ${{ env.LC_APPLICATION_ID }}
                  scan-targets: 'container:docker.io/sonatypecommunity/the-cla:${{ github.sha }} .'

    code_quality:
        name: Code Quality
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - name: Checkout Code
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  # Disabling shallow clone is recommended for improving relevancy of reporting
                  fetch-depth: 0

            - name: Setup Go
              uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c #v6.4.0
              with:
                  go-version-file: 'go.mod'
                  cache: true

            - name: Run Go Linter
              uses: golangci/golangci-lint-action@1e7e51e771db61008b38414a730f564565cf7c20 #v9.2.0
              with:
                  version: v2.12.1
